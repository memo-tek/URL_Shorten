services:
  app:
    build: .
    container_name: url-shortener-app
    ports:
      - "3000:3000"
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=myuser
      - PGPASSWORD=mysecretpassword
      - PGDATABASE=url_shortener
      - PORT=3000
      - BASE_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: url-shortener-postgres
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: