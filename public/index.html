<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>URL Shortener — CodeAlpha</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 560px;
    margin: 60px auto;
    padding: 0 20px;
    background: #f7f7fb;
    color: #222;
  }
  h1 { font-size: 1.5rem; }
  form {
    display: flex;
    gap: 8px;
    margin: 24px 0;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
  }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    background: #4f46e5;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #4338ca; }
  #result, #error {
    margin-top: 16px;
    padding: 12px;
    border-radius: 6px;
  }
  #result { background: #e6f9ee; display: none; word-break: break-all; }
  #error { background: #fdecec; color: #b42318; display: none; }
  #history { margin-top: 32px; }
  #history table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  #history th, #history td { text-align: left; padding: 6px 4px; border-bottom: 1px solid #e2e2e2; }
</style>
</head>
<body>
  <h1>🔗 URL Shortener</h1>
  <form id="shorten-form">
    <input type="text" id="url-input" placeholder="Paste a long URL, e.g. https://example.com/page" required />
    <button type="submit">Shorten</button>
  </form>

  <div id="result"></div>
  <div id="error"></div>

  <div id="history">
    <h2>Recent links</h2>
    <table>
      <thead><tr><th>Short URL</th><th>Original URL</th><th>Clicks</th></tr></thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('shorten-form');
    const input = document.getElementById('url-input');
    const result = document.getElementById('result');
    const error = document.getElementById('error');
    const historyBody = document.getElementById('history-body');

    async function loadHistory() {
      try {
        const res = await fetch('/api/urls');
        const urls = await res.json();
        historyBody.innerHTML = urls.map(u => `
          <tr>
            <td><a href="${u.shortUrl}" target="_blank">${u.shortUrl}</a></td>
            <td>${u.originalUrl}</td>
            <td>${u.clicks}</td>
          </tr>
        `).join('');
      } catch (e) {
        // silently ignore history load errors
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.style.display = 'none';
      error.style.display = 'none';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: input.value }),
        });
        const data = await res.json();

        if (!res.ok) {
          error.textContent = data.error || 'Something went wrong.';
          error.style.display = 'block';
          return;
        }

        result.innerHTML = `Short URL: <a href="${data.shortUrl}" target="_blank">${data.shortUrl}</a>`;
        result.style.display = 'block';
        input.value = '';
        loadHistory();
      } catch (e) {
        error.textContent = 'Could not reach the server.';
        error.style.display = 'block';
      }
    });

    loadHistory();
  </script>
</body>
</html>
